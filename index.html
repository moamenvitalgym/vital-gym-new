:root[data-theme="dark"]{--bg:#191919;--surface:#1f1f1f;--text:#efefef;--muted:#9c9c9c;--border:#353535;--head:#2a2a2a;--auto:#2b2b2b;--autoh:#404040;--gold:#efefef;--zebra:#232323;--yellow:#3a3420;--accent:#efefef;--ok:#1f2e22;--okt:#8bc98f;--warn:#33291a;--warnt:#e0b94f;--bad:#382020;--badt:#ef8f8f;--ex:#252525;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;display:flex;align-items:flex-start;background:var(--bg);color:var(--text);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);width:160px;flex-shrink:0;min-height:100vh;background:var(--surface);color:var(--text);border-inline-end:1px solid var(--border);z-index:15}
.bar{padding:14px 10px}
h1{font-size:1.05rem;margin:0 8px}.sub{font-size:.78rem;color:var(--muted);margin:2px 8px 16px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{font:inherit;font-size:.9rem;display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:10px;color:var(--muted);padding:8px 10px;cursor:pointer;white-space:nowrap;text-align:left}nav button:hover{background:var(--zebra);color:var(--text)}
nav button.on{background:var(--autoh);color:var(--text);font-weight:600}
main{flex:1;min-width:0;max-width:1200px;margin:0 auto;padding:22px 22px 40px}
.demo{background:var(--ex);color:var(--muted);border-radius:18px;padding:10px 16px;font-size:.84rem;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 4px}.hint{color:var(--muted);font-size:.84rem;margin:0 0 10px}
.wrap{overflow:auto;max-height:70vh;background:var(--surface);border:1px solid var(--border);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--headtext);padding:8px 10px;text-align:left;white-space:nowrap;font-weight:600}
th.a{background:var(--autoh)}
td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
td.a{background:var(--auto);color:var(--muted);font-weight:600}
tr:hover td:not(.a){background:#262626}
tr.late td:first-child{box-shadow:inset -3px 0 0 var(--badt)}
td.a.ld{color:var(--badt);font-weight:600}
tr.ex td{font-style:italic;color:var(--muted)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.form label{display:flex;flex-direction:column;font-size:.76rem;color:var(--muted);gap:2px}
input,select{font:inherit;font-size:.85rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 9px;max-width:170px}
button.add{font:inherit;background:var(--accent);color:#191919;border:0;border-radius:10px;padding:8px 18px;cursor:pointer}
.tag{border-radius:99px;padding:1px 9px;font-size:.76rem;font-weight:600;white-space:nowrap}
.t-o{background:var(--bad);color:var(--badt)}.t-p{background:var(--warn);color:var(--warnt)}.t-r{background:var(--ok);color:var(--okt)}
.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:2px 12px;font-size:.78rem;font-weight:600;cursor:pointer;max-width:none}.p-o{background:var(--bad);color:var(--badt)}.p-p{background:var(--warn);color:var(--warnt)}.p-r{background:var(--ok);color:var(--okt)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px}.card b{font-size:1.5rem;display:block}.card span{font-size:.8rem;color:var(--muted)}
.per{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.per input{background:var(--yellow)}
h3{font-size:.95rem;margin:16px 0 6px}
.logo{margin:4px 8px 18px}.logo img{display:block;width:100%;height:auto}.pr{display:flex;align-items:center;gap:8px;min-width:130px}.trk{flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden}.trk i{display:block;height:100%}
@media (max-width:800px){header{width:104px}.bar{padding:10px 6px}.logo{margin:2px 6px 12px}nav button{font-size:.78rem;gap:5px;padding:8px 6px;white-space:normal;line-height:1.3}nav button svg{flex-shrink:0;width:14px;height:14px}main{padding:12px 10px 30px}.form label{flex:1 1 130px}input,select{max-width:100%}}
.auth{max-width:340px;flex-direction:column;align-items:stretch;margin:30px auto}.auth input{max-width:none}
.ce{width:100%;min-width:90px;max-width:none;background:transparent;border:1px solid transparent;padding:3px 6px}.ce:hover,.ce:focus{border-color:var(--border);background:var(--bg)}
.mdl{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50}.mdl .box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;width:min(320px,90vw)}.mdl input{width:100%;max-width:none;margin:8px 0}.mdl .add{margin-inline-end:6px}
.gs{position:relative;margin:0 0 16px;max-width:460px}.gs input{width:100%;max-width:none;padding:8px 10px;font-size:.8rem;border-radius:10px}#gr{position:absolute;inset-inline-start:0;width:min(320px,86vw);top:100%;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:4px;max-height:60vh;overflow:auto;display:none}#gr div{padding:8px 14px;border-bottom:1px solid var(--border);cursor:pointer}#gr div:hover{background:var(--zebra)}
</style>
</head>
